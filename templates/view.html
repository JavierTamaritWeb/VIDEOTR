<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ filename }} - VideoTR</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #10b981;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }

        .header-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.8) 100%);
            margin-bottom: 2rem;
        }

        .content-area {
            background: rgba(248, 250, 252, 0.9);
            border-radius: 15px;
            padding: 2rem;
            font-size: 1.1rem;
            line-height: 1.8;
            max-height: 600px;
            overflow-y: auto;
            border: 2px solid rgba(103, 126, 234, 0.1);
        }

        .content-area::-webkit-scrollbar {
            width: 8px;
        }

        .content-area::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.5);
            border-radius: 10px;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 10px;
        }

        .btn-action {
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            margin: 0 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--success-color), #34d399);
            border: none;
            color: white;
        }

        .btn-back {
            background: linear-gradient(135deg, #6b7280, #4b5563);
            border: none;
            color: white;
        }

        .btn-copy {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .stats-row {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Header -->
        <div class="card header-card">
            <div class="card-body text-center">
                <h1 class="display-6 fw-bold mb-2">
                    <i class="fas fa-file-text text-primary me-3"></i>
                    {{ filename }}
                </h1>
                <p class="text-muted">Visualización de transcripción</p>
            </div>
        </div>

        <!-- Estadísticas -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row stats-row">
                    <div class="col-md-3 stat-item">
                        <div class="stat-number" id="wordCount">-</div>
                        <div class="stat-label">Palabras</div>
                    </div>
                    <div class="col-md-3 stat-item">
                        <div class="stat-number" id="charCount">-</div>
                        <div class="stat-label">Caracteres</div>
                    </div>
                    <div class="col-md-3 stat-item">
                        <div class="stat-number" id="lineCount">-</div>
                        <div class="stat-label">Líneas</div>
                    </div>
                    <div class="col-md-3 stat-item">
                        <div class="stat-number" id="readTime">-</div>
                        <div class="stat-label">Min. lectura</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contenido principal -->
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">
                        <i class="fas fa-align-left me-2"></i>Transcripción
                    </h5>
                    <div>
                        <button class="btn btn-copy btn-action" onclick="copyToClipboard()">
                            <i class="fas fa-copy me-2"></i>Copiar
                        </button>
                    </div>
                </div>

                <div class="content-area" id="transcriptionContent">
                    {{ content }}
                </div>

                <div class="text-center mt-4">
                    <a href="/download/{{ filename }}" class="btn btn-download btn-action">
                        <i class="fas fa-download me-2"></i>Descargar Archivo
                    </a>
                    <a href="/history" class="btn btn-back btn-action">
                        <i class="fas fa-history me-2"></i>Volver al Historial
                    </a>
                    <a href="/" class="btn btn-back btn-action">
                        <i class="fas fa-home me-2"></i>Inicio
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast para notificaciones -->
    <div class="toast-container">
        <div class="toast" id="copyToast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-success text-white">
                <i class="fas fa-check-circle me-2"></i>
                <strong class="me-auto">¡Copiado!</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body">
                Transcripción copiada al portapapeles
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Calcular estadísticas del texto
        function calculateStats() {
            const content = document.getElementById('transcriptionContent').textContent;
            
            const words = content.trim() ? content.trim().split(/\s+/).length : 0;
            const chars = content.length;
            const lines = content.split('\n').length;
            const readTime = Math.ceil(words / 200); // Asumiendo 200 palabras por minuto
            
            document.getElementById('wordCount').textContent = words.toLocaleString();
            document.getElementById('charCount').textContent = chars.toLocaleString();
            document.getElementById('lineCount').textContent = lines.toLocaleString();
            document.getElementById('readTime').textContent = readTime;
        }

        // Copiar al portapapeles
        async function copyToClipboard() {
            const content = document.getElementById('transcriptionContent').textContent;
            
            try {
                await navigator.clipboard.writeText(content);
                showCopyToast();
            } catch (err) {
                // Fallback para navegadores más antiguos
                const textArea = document.createElement('textarea');
                textArea.value = content;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showCopyToast();
            }
        }

        function showCopyToast() {
            const toast = new bootstrap.Toast(document.getElementById('copyToast'));
            toast.show();
        }

        // Inicializar cuando la página carga
        document.addEventListener('DOMContentLoaded', function() {
            calculateStats();
        });
    </script>
</body>
</html>
